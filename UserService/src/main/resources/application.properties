spring.application.name=UserService


server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://localhost:3306/wipro
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



#spring.cloud.discovery.client.simple.instances.PRODUCT-SERVICE[0].uri=http://localhost:8082
#spring.cloud.discovery.client.simple.instances.PRODUCT-SERVICE[1].uri=http://localhost:8083

resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.userService.sliding-window-size=6
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=2


# expose actuator endpoints
management.endpoints.web.exposure.include=*

# enable prometheus endpoint
management.endpoint.prometheus.access=unrest
