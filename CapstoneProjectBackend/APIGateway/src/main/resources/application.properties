spring.application.name=APIGateway
server.port=9000
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#Database
spring.datasource.url=jdbc:mysql://localhost:3306/MusicLibraryAPIGateway
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ADMINSERVICE
spring.cloud.gateway.server.webmvc.routes[0].id=ADMINSERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ADMINSERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/admin/**

# AUTHSERVICE
spring.cloud.gateway.server.webmvc.routes[1].id=AUTHSERVICE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://AUTHSERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/auth/**

# USERSERVICE
spring.cloud.gateway.server.webmvc.routes[2].id=USERSERVICE
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://USERSERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/users/playlists/**

# NOTIFICATIONSERVICE
spring.cloud.gateway.server.webmvc.routes[3].id=NOTIFICATIONSERVICE
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://NOTIFICATIONSERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/notifications/**


# ==========================================
# SWAGGER / OPENAPI GATEWAY CONFIGURATION
# ==========================================

# Core UI Settings
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.enabled=true

# Define Definition Groups for the Swagger Dropdown Menu
# This tells the gateway where to pull the OpenAPI JSON for each microservice

# AUTH Swagger Docs
spring.cloud.gateway.server.webmvc.routes[4].id=AUTH-SWAGGER
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://AUTHSERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

# ADMIN Swagger Docs
spring.cloud.gateway.server.webmvc.routes[5].id=ADMIN-SWAGGER
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://ADMINSERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/admin/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

# USER Swagger Docs
spring.cloud.gateway.server.webmvc.routes[6].id=USER-SWAGGER
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://USERSERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/users/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1

# NOTIFICATION Swagger Docs
spring.cloud.gateway.server.webmvc.routes[7].id=NOTIFICATION-SWAGGER
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://NOTIFICATIONSERVICE
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/notifications/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=StripPrefix=1