<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Library - Login & Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      display: flex;
      min-height: 550px;
    }

    .auth-image {
      flex: 1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .auth-image::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -50px;
      right: -50px;
    }

    .auth-image::after {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      bottom: -30px;
      left: -30px;
    }

    .auth-image i {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .auth-image h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .auth-image p {
      text-align: center;
      opacity: 0.9;
      font-size: 15px;
    }

    .auth-forms {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .auth-tab {
      flex: 1;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: transparent;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: transparent;
      color: white;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-title {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .form-subtitle {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 18px;
      border-radius: 15px;
    }

    .input-group-text {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-right: none;
      color: #64748b;
    }

    .form-control {
      border: 1px solid #e2e8f0;
      padding: 14px 16px;
      font-size: 14px;
      color: #051123;
      background-color: #f8fafc;
    }

    .form-control:focus {
      border-color: #667eea;
      color: #051123;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .role-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #4356b6;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .role-btn i {
      font-size: 20px;
      margin-bottom: 5px;
      display: block;
    }

    .role-btn.active {
      border-color: #2143d7;
      background: rgba(22, 44, 143, 0.1);
      color: #152777;

    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      color: white;
    }

    #authMessage {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    #authMessage.success {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid #10b981;
    }

    #authMessage.error {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid #ef4444;
    }

    @media (max-width: 768px) {
      .auth-container {
        flex-direction: column;
        max-width: 450px;
      }

      .auth-image {
        padding: 30px;
        min-height: 200px;
      }

      .auth-image i {
        font-size: 50px;
      }

      .auth-image h2 {
        font-size: 22px;
      }

      .auth-forms {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-image">
      <i class="fas fa-music"></i>
      <h2>Music Library</h2>
      <p>Your personal music streaming platform. Access thousands of songs, create playlists, and discover new music.
      </p>
    </div>
    <div class="auth-forms">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="signin">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <button class="auth-tab" data-tab="signup">
          <i class="fas fa-user-plus"></i> Sign Up
        </button>
      </div>

      <div id="authMessage"></div>

      <!-- Sign In Form -->
      <form id="signinForm" class="auth-form active">
        <h3 class="form-title">Welcome Back!</h3>
        <p class="form-subtitle">Sign in to continue to your music library</p>

        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" id="loginUsername" class="form-control" placeholder="Username" required>
        </div>

        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
        </div>

        <div class="role-selector">
          <div class="role-btn active" data-role="USER" onclick="selectRole(this, 'loginRole')">
            <i class="fas fa-user"></i>
            <span>User</span>
          </div>
          <div class="role-btn" data-role="ADMIN" onclick="selectRole(this, 'loginRole')">
            <i class="fas fa-crown"></i>
            <span>Admin</span>
          </div>
          <input type="hidden" id="loginRole" value="USER">
        </div>

        <button type="submit" class="btn-submit">
          <i class="fas fa-sign-in-alt me-2"></i> Sign In
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="signupForm" class="auth-form">
        <h3 class="form-title">Create Account</h3>
        <p class="form-subtitle">Sign up to start your music journey</p>

        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" id="signupUsername" class="form-control" placeholder="Username" required>
        </div>

        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" id="signupPassword" class="form-control" placeholder="Password" required>
        </div>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="email" id="signupEmail" class="form-control" placeholder="Email"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" required>
        </div>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="tel" id="signupPhone" class="form-control" required minlength="10" maxlength="10"
            pattern="\d{10}" title="Please enter exactly 10 digits" placeholder="1234567890" />
        </div>
        <button type="submit" class="btn-submit">
          <i class="fas fa-user-plus me-2"></i> Create Account
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>


    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
      });
    });


    // Role selection
    function selectRole(btn, inputId) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(inputId).value = btn.dataset.role;
    }


    // Show message
    function showMessage(message, type = 'success') {
      const msgEl = document.getElementById('authMessage');
      msgEl.textContent = message;
      msgEl.className = type;
      msgEl.style.display = 'block';
      setTimeout(() => msgEl.style.display = 'none', 1000);
    }





    // Sign In
    document.getElementById('signinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const selectedRole = document.getElementById('loginRole').value; // USER or ADMIN (UI values)

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username,
            password,
            role: selectedRole
          })
        });

        if (!response.ok) {
          throw new Error("Invalid credentials");
        }

        const data = await response.json();
        console.log("LOGIN RESPONSE:", data);

        const backendRole = data.role;
        const fallbackRole = selectedRole === 'ADMIN' ? 'ROLE_ADMIN' : 'ROLE_USER';
        const userRoleToStore = backendRole || fallbackRole;

        localStorage.setItem("jwt_token", data.token);
        localStorage.setItem("user_role", userRoleToStore);
        localStorage.setItem("user_id", data.id || data.userId);
        localStorage.setItem("username", data.username || username);

        if (selectedRole === 'ADMIN' && userRoleToStore !== 'ROLE_ADMIN') {
          showMessage('Admin login not allowed for this account. Please use User toggle.', 'error');
          localStorage.clear();
          return;
        }

        if (selectedRole === 'USER' && userRoleToStore === 'ROLE_ADMIN') {
          showMessage('Admin account must login using Admin toggle.', 'error');
          localStorage.clear();
          return;
        }

        showMessage('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          window.location.href =
            userRoleToStore === "ROLE_ADMIN" ? "./admin-dashboard.html" : "./dashboard.html";
        }, 100);
      } 
      catch (err) {
        showMessage('Login failed. Please check your credentials.', 'error');
      }
      signinForm.reset();
    });



    // Sign Up
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value;
      const password = document.getElementById('signupPassword').value;
      const email = document.getElementById('signupEmail').value;
      const phone = document.getElementById('signupPhone').value;

      try {
        const res = await fetch(`${API_BASE}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(
            {
              username,
              password,
              email,
              phone
            })
        });

        if (!res.ok) throw new Error('Registration failed');

        showMessage('Account created! Please sign in.', 'success');
        document.querySelector('[data-tab="signin"]').click();
      } catch (err) {
        showMessage('Registration failed. Username may already exist.', 'error');
      }
      signupForm.reset();
    });
  </script>
</body>

</html>
