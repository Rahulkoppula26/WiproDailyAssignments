<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome - Music Library</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Poppins, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #28206f, #080814 65%);
      color: white;
    }

    .welcome-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(3px);
      opacity: 0.6;
      animation: float 6s ease-in-out infinite;
    }

    .circle.one {
      width: 220px;
      height: 220px;
      background: #7c5cff;
      top: 8%;
      left: 8%;
    }

    .circle.two {
      width: 280px;
      height: 280px;
      background: #20c7a8;
      right: 8%;
      bottom: 10%;
      animation-delay: 1.5s;
    }

    .circle.three {
      width: 120px;
      height: 120px;
      background: #ff3d81;
      right: 25%;
      top: 15%;
      animation-delay: 2.5s;
    }

    .welcome-card {
      position: relative;
      z-index: 2;
      width: min(1050px, 100%);
      min-height: 580px;
      border-radius: 34px;
      padding: 55px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
      animation: fadeUp 1s ease forwards;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 25px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: linear-gradient(135deg, #7c5cff, #20c7a8);
      animation: pulse 2s infinite;
    }

    .brand h3 {
      font-size: 25px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1;
      font-weight: 900;
      margin-bottom: 22px;
    }

   h1 span {
    background: linear-gradient(
        135deg,
        #9d8cff,
        #20c7a8,
        #ff3d81
    );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
    color: transparent;
}

    .subtitle {
      color: #b9c3e6;
      font-size: 18px;
      line-height: 1.8;
      max-width: 620px;
      margin-bottom: 34px;
    }

    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-start {
      text-decoration: none;
      border: none;
      color: white;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 30px;
      border-radius: 18px;
      background: linear-gradient(135deg, #7c5cff, #20c7a8);
      box-shadow: 0 18px 45px rgba(124, 92, 255, 0.38);
      transition: 0.3s ease;
    }

    .btn-start:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 25px 60px rgba(32, 199, 168, 0.45);
    }

    .music-visual {
      height: 390px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 14px;
      padding: 35px;
      position: relative;
      overflow: hidden;
    }

    .music-visual::before {
      content: "\f001";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      top: 60px;
      font-size: 95px;
      color: rgba(255, 255, 255, 0.12);
      animation: rotateMusic 5s linear infinite;
    }

    .bar {
      width: 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #20c7a8, #7c5cff);
      animation: equalizer 1.2s ease-in-out infinite;
    }

    .bar:nth-child(1) { height: 80px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 140px; animation-delay: .15s; }
    .bar:nth-child(3) { height: 210px; animation-delay: .3s; }
    .bar:nth-child(4) { height: 120px; animation-delay: .45s; }
    .bar:nth-child(5) { height: 180px; animation-delay: .6s; }
    .bar:nth-child(6) { height: 95px; animation-delay: .75s; }

    .note {
      position: absolute;
      font-size: 28px;
      color: rgba(255,255,255,0.5);
      animation: noteFloat 5s linear infinite;
    }

    .note.n1 { left: 12%; bottom: 12%; }
    .note.n2 { right: 16%; bottom: 20%; animation-delay: 1.4s; }
    .note.n3 { left: 45%; bottom: 10%; animation-delay: 2.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes equalizer {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }

    @keyframes rotateMusic {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes noteFloat {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      100% {
        transform: translateY(-280px) scale(1.5);
        opacity: 0;
      }
    }

    @media(max-width: 850px) {
      body {
        overflow: auto;
      }

      .welcome-card {
        grid-template-columns: 1fr;
        padding: 35px;
      }

      .music-visual {
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <div class="welcome-page">
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="welcome-card">
      <div>
        <div class="brand">
          <div class="brand-icon">
            <i class="fas fa-music"></i>
          </div>
          <h3>Music Library</h3>
        </div>

        <h1>Feel Your <span>Music</span></h1>

        <p class="subtitle">
          Discover songs, create playlists, explore your favorite artists and enjoy
          a smooth music library experience with a modern dashboard.
        </p>

        <div class="actions">
          <a href="index.html" class="btn-start">
            Move Forward <i class="fas fa-arrow-right ms-2"></i>
          </a>
        </div>
      </div>

      <div class="music-visual">
        <i class="fas fa-music note n1"></i>
        <i class="fas fa-headphones note n2"></i>
        <i class="fas fa-compact-disc note n3"></i>

        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
